# Language packs: grammars kula loads at runtime (`kula lang add <id>`).
# Each pack is pinned to an upstream commit (or a crates.io grammar crate when
# the repository doesn't commit its generated parser) and paired with
# src/index/queries/<id>.scm. `tier` is measured by `kula lang build` on the
# grammar's own test corpus: imports (definitions, calls, imports), calls
# (definitions and calls) or defs (definitions only).

[[pack]]
id = "gdscript"
name = "GDScript"
repo = "https://github.com/PrestonKnopp/tree-sitter-gdscript"
rev = "9686853b696db07118ad110e440d6de0ca6498b4"
exts = ["gd"]
tier = "imports"

