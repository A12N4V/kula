<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="kula – git, with a map">
  <style>
    .bg { fill: #0b0b0d; }
    .grid { fill: #24242b; }
    .ring { fill: none; stroke: #f97f3a; stroke-width: 1.8; stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.4s cubic-bezier(.22,1,.36,1) .1s forwards; }
    .k { fill: none; stroke: #f97f3a; stroke-opacity: .55; stroke-width: .9; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.3s cubic-bezier(.22,1,.36,1) .7s forwards; }
    .node { fill: #f97f3a; opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.22,1,.36,1) forwards; }
    .node.dim { fill-opacity: .6; }
    .core { fill: #e8e2d9; transform-box: fill-box; transform-origin: center; animation: breathe 3.2s ease-in-out 2s infinite; }
    .pulse { fill: none; stroke: #f97f3a; stroke-width: .5; opacity: 0; transform-box: fill-box; transform-origin: center; animation: ripple 3.2s ease-out 2.2s infinite; }
    .orbit { transform-origin: 180px 180px; animation: spin 40s linear infinite; }
    .sat { fill: #7cb7ff; } .sat2 { fill: #8fd694; } .sat3 { fill: #d49cf0; }
    .word { font: 600 92px 'Cormorant Garamond', Garamond, Georgia, serif; fill: #e8e2d9; letter-spacing: -2px; opacity: 0; animation: rise .9s cubic-bezier(.22,1,.36,1) .6s forwards; }
    .tag { font: 400 24px 'JetBrains Mono', ui-monospace, monospace; fill: #b5ac9f; opacity: 0; animation: rise .9s cubic-bezier(.22,1,.36,1) .9s forwards; }
    .mono { font: 500 14px 'JetBrains Mono', 'SF Mono', Menlo, monospace; fill: #7a7269; opacity: 0; animation: rise .9s cubic-bezier(.22,1,.36,1) 1.2s forwards; }
    .accent { fill: #f97f3a; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { 0% { opacity: 0; transform: scale(.2); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes breathe { 50% { transform: scale(1.12); } }
        @keyframes ripple { 0% { opacity: .8; transform: scale(.3); } 100% { opacity: 0; transform: scale(2.2); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0s !important; animation-delay: 0s !important; } }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" class="grid"/></pattern>
    <radialGradient id="glow" cx="180" cy="180" r="220" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f97f3a" stop-opacity=".16"/><stop offset="1" stop-color="#f97f3a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect class="bg" width="960" height="360" rx="18"/>
  <rect width="960" height="360" rx="18" fill="url(#dots)" opacity=".7"/>
  <rect width="960" height="360" rx="18" fill="url(#glow)"/>

  <!-- the mark: a K drawn inside the kula ring, every stroke on the hexagon's lattice -->
  <g transform="translate(60 60) scale(7.5)">
    <polygon class="ring" pathLength="100" points="16,4 25.38,8.52 27.7,18.67 21.21,26.81 10.79,26.81 4.3,18.67 6.62,8.52" stroke-linejoin="round"/>
    <path class="k" pathLength="100" d="M16 4 21.21 26.81 6.62 8.52 27.7 18.67 4.3 18.67 25.38 8.52 10.79 26.81Z"/>
    <circle class="node" cx="16" cy="4" r="1.9" style="animation-delay:1.20s"/>
    <circle class="node" cx="25.38" cy="8.52" r="1.9" style="animation-delay:1.32s"/>
    <circle class="node" cx="27.7" cy="18.67" r="1.9" style="animation-delay:1.44s"/>
    <circle class="node" cx="21.21" cy="26.81" r="1.9" style="animation-delay:1.56s"/>
    <circle class="node" cx="10.79" cy="26.81" r="1.9" style="animation-delay:1.68s"/>
    <circle class="node" cx="4.3" cy="18.67" r="1.9" style="animation-delay:1.80s"/>
    <circle class="node" cx="6.62" cy="8.52" r="1.9" style="animation-delay:1.92s"/>
    <circle class="node dim" cx="28" cy="16" r="1.6" style="animation-delay:1.8s"/>
    <circle class="node dim" cx="4" cy="16" r="1.6" style="animation-delay:1.95s"/>
    <circle class="pulse" cx="16" cy="16" r="5"/>
    <circle class="core" cx="16" cy="16" r="2.4"/>
  </g>
  <g class="orbit">
    <circle class="sat" cx="180" cy="22" r="4"/>
    <circle class="sat2" cx="338" cy="180" r="3.5"/>
    <circle class="sat3" cx="48" cy="262" r="3"/>
  </g>

  <text x="380" y="170" class="word">kula</text>
  <text x="384" y="214" class="tag">git, with a map.</text>
  <text x="384" y="262" class="mono"><tspan class="accent">❯</tspan> kula index  ·  kula view  ·  kula impact &lt;symbol&gt;</text>
</svg>
