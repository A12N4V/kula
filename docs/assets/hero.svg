<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="kula – git, with a map">
  <style>
    .bg { fill: #0b0b0d; }
    .grid { fill: #24242b; }
    .ring { fill: none; stroke: #ff9e6d; stroke-opacity: .38; stroke-width: 1.4; stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.4s cubic-bezier(.22,1,.36,1) .1s forwards; }
    .k { fill: none; stroke: #ff9e6d; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.3s cubic-bezier(.22,1,.36,1) .7s forwards; }
    .node { fill: #ff9e6d; opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.22,1,.36,1) forwards; }
    .node.dim { fill-opacity: .6; }
    .core { fill: #ece8e1; transform-box: fill-box; transform-origin: center; animation: breathe 3.2s ease-in-out 2s infinite; }
    .pulse { fill: none; stroke: #ff9e6d; stroke-width: .5; opacity: 0; transform-box: fill-box; transform-origin: center; animation: ripple 3.2s ease-out 2.2s infinite; }
    .orbit { transform-origin: 180px 180px; animation: spin 40s linear infinite; }
    .sat { fill: #7cb7ff; } .sat2 { fill: #8fd694; } .sat3 { fill: #d49cf0; }
    .word { font: 600 84px 'Geist', 'Inter', ui-sans-serif, system-ui, sans-serif; fill: #ece8e1; letter-spacing: -2px; opacity: 0; animation: rise .9s cubic-bezier(.22,1,.36,1) .6s forwards; }
    .tag { font: 400 24px 'Geist', 'Inter', ui-sans-serif, system-ui, sans-serif; fill: #a9a49c; opacity: 0; animation: rise .9s cubic-bezier(.22,1,.36,1) .9s forwards; }
    .mono { font: 500 14px 'Geist Mono', 'SF Mono', Menlo, monospace; fill: #6d6a66; opacity: 0; animation: rise .9s cubic-bezier(.22,1,.36,1) 1.2s forwards; }
    .accent { fill: #ff9e6d; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { 0% { opacity: 0; transform: scale(.2); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes breathe { 50% { transform: scale(1.12); } }
        @keyframes ripple { 0% { opacity: .8; transform: scale(.3); } 100% { opacity: 0; transform: scale(2.2); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0s !important; animation-delay: 0s !important; } }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" class="grid"/></pattern>
    <radialGradient id="glow" cx="180" cy="180" r="220" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff9e6d" stop-opacity=".16"/><stop offset="1" stop-color="#ff9e6d" stop-opacity="0"/></radialGradient>
  </defs>
  <rect class="bg" width="960" height="360" rx="18"/>
  <rect width="960" height="360" rx="18" fill="url(#dots)" opacity=".7"/>
  <rect width="960" height="360" rx="18" fill="url(#glow)"/>

  <!-- the mark: a K drawn inside the kula ring, every stroke on the hexagon's lattice -->
  <g transform="translate(60 60) scale(7.5)">
    <polygon class="ring" pathLength="100" points="28,16 22,26.39 10,26.39 4,16 10,5.61 22,5.61" stroke-linejoin="round"/>
    <path class="k" pathLength="100" d="M10 5.61V26.39M10 16H16M22 5.61 16 16 22 26.39"/>
    <circle class="node" cx="10" cy="5.61" r="2.3" style="animation-delay:1.2s"/>
    <circle class="node" cx="22" cy="5.61" r="2.3" style="animation-delay:1.35s"/>
    <circle class="node" cx="22" cy="26.39" r="2.3" style="animation-delay:1.5s"/>
    <circle class="node" cx="10" cy="26.39" r="2.3" style="animation-delay:1.65s"/>
    <circle class="node dim" cx="28" cy="16" r="1.6" style="animation-delay:1.8s"/>
    <circle class="node dim" cx="4" cy="16" r="1.6" style="animation-delay:1.95s"/>
    <circle class="pulse" cx="16" cy="16" r="5"/>
    <circle class="core" cx="16" cy="16" r="3.1"/>
  </g>
  <g class="orbit">
    <circle class="sat" cx="180" cy="22" r="4"/>
    <circle class="sat2" cx="338" cy="180" r="3.5"/>
    <circle class="sat3" cx="48" cy="262" r="3"/>
  </g>

  <text x="380" y="170" class="word">kula</text>
  <text x="384" y="214" class="tag">git, with a map.</text>
  <text x="384" y="262" class="mono"><tspan class="accent">❯</tspan> kula index  ·  kula view  ·  kula impact &lt;symbol&gt;</text>
</svg>
