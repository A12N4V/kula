# Tag `vX.Y.Z` → binaries for 5 targets, .deb, wheels (PyPI), npm packages,
# crates.io, and a Homebrew formula bump. Required secrets:
#   NPM_TOKEN, CARGO_REGISTRY_TOKEN, TAP_TOKEN (push to arnavsharma/homebrew-tap)
# PyPI uses trusted publishing (configure the `pypi` environment on PyPI).
name: release
on:
  push: { tags: ["v*"] }
permissions: { contents: write, id-token: write }

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm -C web install --frozen-lockfile && pnpm -C web build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist }

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, npm: darwin-arm64 }
          - { target: x86_64-apple-darwin, os: macos-13, npm: darwin-x64 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, npm: linux-x64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, npm: linux-arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, npm: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp target/${{ matrix.target }}/release/kula$ext dist/
          tar -czf kula-${{ matrix.target }}.tar.gz -C dist kula$ext
          (sha256sum kula-${{ matrix.target }}.tar.gz 2>/dev/null || shasum -a 256 kula-${{ matrix.target }}.tar.gz) > kula-${{ matrix.target }}.tar.gz.sha256
          ./packaging/npm/make-platform-package.sh ${{ matrix.npm }} dist/kula$ext "${GITHUB_REF_NAME#v}" npm-out
      - if: contains(matrix.target, 'linux')
        run: cargo install cargo-deb --locked && cargo deb --no-build --no-strip --target ${{ matrix.target }} -o .
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            kula-*.tar.gz*
            *.deb
            npm-out
      - uses: PyO3/maturin-action@v1
        with: { command: build, args: "--release --out wheels", target: "${{ matrix.target }}" }
      - uses: actions/upload-artifact@v4
        with: { name: "wheels-${{ matrix.target }}", path: wheels }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/bin-*/kula-*.tar.gz*
            artifacts/bin-*/*.deb
            scripts/install.sh
      - name: PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: artifacts, skip-existing: true }
        continue-on-error: true
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - name: npm
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          v="${GITHUB_REF_NAME#v}"
          for d in artifacts/bin-*/npm-out/*/; do npm publish "$d" --access public; done
          cd packaging/npm/kula-cli && cp ../../../README.md . \
            && npm version "$v" --no-git-tag-version --allow-same-version \
            && sed -i "s/\"0\.1\.0\"/\"$v\"/g" package.json && npm publish --access public
      - name: crates.io
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
        run: |
          cp -r artifacts/web-dist web/dist
          cargo publish --allow-dirty
      - name: Homebrew tap
        env: { TAP_TOKEN: "${{ secrets.TAP_TOKEN }}" }
        run: |
          v="${GITHUB_REF_NAME#v}"; f=packaging/homebrew/kula.rb
          sed -i "s/version \".*\"/version \"$v\"/" $f
          for t in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            sha=$(cut -d' ' -f1 artifacts/bin-$t/kula-$t.tar.gz.sha256)
            key=SHA256_$(echo $t | tr 'a-z-' 'A-Z_'); sed -i "s/$key/$sha/" $f
          done
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/arnavsharma/homebrew-tap" tap
          mkdir -p tap/Formula && cp $f tap/Formula/kula.rb
          cd tap && git add -A && git -c user.name=kula-bot -c user.email=bot@kula.dev commit -m "kula $v" && git push
