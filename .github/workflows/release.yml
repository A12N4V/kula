# Tag `vX.Y.Z` → binaries for 5 targets, .deb packages and install.sh on a
# GitHub release, then the registries. Registry steps run only when their
# credential is configured, so a release never fails for a missing token:
#   NPM_TOKEN             npm (needs the @kula-cli org on npmjs.com)
#   CARGO_REGISTRY_TOKEN  crates.io
#   PyPI                  trusted publishing (add this repo + workflow on pypi.org),
#                         or set the PYPI_API_TOKEN secret
#   TAP_TOKEN             push the Homebrew formula to A12N4V/homebrew-tap
#   APT_GPG_KEY           ASCII-armoured private key that signs the apt repository
#                         served from GitHub Pages (Pages source: GitHub Actions)
name: release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: write, id-token: write, pages: write }

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm -C web install --frozen-lockfile && pnpm -C web build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist }

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, npm: darwin-arm64 }
          - { target: x86_64-apple-darwin, os: macos-latest, npm: darwin-x64 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, npm: linux-x64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, npm: linux-arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, npm: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp target/${{ matrix.target }}/release/kula$ext dist/
          tar -czf kula-${{ matrix.target }}.tar.gz -C dist kula$ext
          (sha256sum kula-${{ matrix.target }}.tar.gz 2>/dev/null || shasum -a 256 kula-${{ matrix.target }}.tar.gz) > kula-${{ matrix.target }}.tar.gz.sha256
          ./packaging/npm/make-platform-package.sh ${{ matrix.npm }} dist/kula$ext "${GITHUB_REF_NAME#v}" npm-out
      - if: contains(matrix.target, 'linux')
        run: cargo install cargo-deb --locked && cargo deb --no-build --no-strip --target ${{ matrix.target }} -o .
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            kula-*.tar.gz*
            *.deb
            npm-out
      - uses: PyO3/maturin-action@v1
        with: { command: build, args: "--release --out wheels --target-dir target-wheels", target: "${{ matrix.target }}", manylinux: "2_28" }
      - uses: actions/upload-artifact@v4
        with: { name: "wheels-${{ matrix.target }}", path: wheels }

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      # Source tarball with the built web UI inside, so distro builds need only Rust.
      - name: source tarball
        run: |
          v="${GITHUB_REF_NAME#v}"; n="kula-$v"
          git archive --format=tar --prefix="$n/" HEAD | tar -x -C .
          mkdir -p "$n/web/dist" && cp -r artifacts/web-dist/. "$n/web/dist/"
          tar -czf "$n-src.tar.gz" "$n" && sha256sum "$n-src.tar.gz" > "$n-src.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/bin-*/kula-*.tar.gz*
            artifacts/bin-*/*.deb
            kula-*-src.tar.gz*
            scripts/install.sh

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    continue-on-error: true  # until trusted publishing is configured on pypi.org
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "wheels-*", path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

  npm:
    needs: build
    runs-on: ubuntu-latest
    # setup-node injects a placeholder NODE_AUTH_TOKEN, so gate on the secret itself.
    env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}", HAS_NPM: "${{ secrets.NPM_TOKEN != '' }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "bin-*", path: artifacts }
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - if: env.HAS_NPM == 'true'
        run: |
          v="${GITHUB_REF_NAME#v}"
          for d in artifacts/bin-*/npm-out/*/; do npm publish "$d" --access public || true; done
          cd packaging/npm/kula-cli && cp ../../../README.md . \
            && sed -i -E "s/\"[0-9]+\.[0-9]+\.[0-9]+\"/\"$v\"/g" package.json && npm publish --access public

  crates:
    needs: build
    runs-on: ubuntu-latest
    env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - uses: dtolnay/rust-toolchain@stable
      - if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --allow-dirty

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    env: { TAP_TOKEN: "${{ secrets.TAP_TOKEN }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "bin-*", path: artifacts }
      - if: env.TAP_TOKEN != ''
        run: |
          v="${GITHUB_REF_NAME#v}"; f=packaging/homebrew/kula.rb
          sed -i "s/version \".*\"/version \"$v\"/" $f
          for t in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            sha=$(cut -d' ' -f1 artifacts/bin-$t/kula-$t.tar.gz.sha256)
            key=SHA256_$(echo $t | tr 'a-z-' 'A-Z_'); sed -i "s/$key/$sha/" $f
          done
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/A12N4V/homebrew-tap" tap
          mkdir -p tap/Formula && cp $f tap/Formula/kula.rb
          cd tap && git add -A && git -c user.name=kula-bot -c user.email=bot@kula.dev commit -m "kula $v" && git push

  # Signed apt repository on GitHub Pages:  https://a12n4v.github.io/kula/apt
  apt:
    needs: release
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    env: { APT_GPG_KEY: "${{ secrets.APT_GPG_KEY }}" }
    steps:
      - uses: actions/checkout@v4
        if: env.APT_GPG_KEY != ''
      - uses: actions/download-artifact@v4
        if: env.APT_GPG_KEY != ''
        with: { pattern: "bin-*linux*", path: artifacts, merge-multiple: true }
      - if: env.APT_GPG_KEY != ''
        run: ./packaging/apt/build-repo.sh artifacts site
      - uses: actions/upload-pages-artifact@v3
        if: env.APT_GPG_KEY != ''
        with: { path: site }
      - id: deploy
        if: env.APT_GPG_KEY != ''
        uses: actions/deploy-pages@v4
