# Tag `vX.Y.Z` → binaries for 5 targets, .deb packages and install.sh on a
# GitHub release, then the registries. Registry steps run only when their
# credential is configured, so a release never fails for a missing token:
#   npm                   trusted publishing, no token (each @kula-cli package
#                         trusts this repo + release.yml on npmjs.com)
#   CARGO_REGISTRY_TOKEN  crates.io
#   PyPI                  trusted publishing (add this repo + workflow on pypi.org),
#                         or set the PYPI_API_TOKEN secret
#   Homebrew              none: this repo is the tap; Formula/kula.rb is committed to main
#   APT_GPG_KEY           ASCII-armoured private key that signs the apt repository
#                         served from GitHub Pages (Pages source: GitHub Actions)
name: release
on:
  push: { tags: ["v*"] }
  # Launcher-only publish (@kula-cli/kula) for platform packages already on npm,
  # e.g. a launcher fix. Lives here because npm trusts one workflow per package.
  workflow_dispatch:
    inputs:
      version: { description: "launcher version, e.g. 0.3.1", required: true }
      platforms: { description: "platform package version, if different", required: false }
permissions: { contents: write, id-token: write, pages: write }

jobs:
  web:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm -C web install --frozen-lockfile && pnpm -C web build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist }

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, npm: darwin-arm64 }
          - { target: x86_64-apple-darwin, os: macos-latest, npm: darwin-x64 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, npm: linux-x64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, npm: linux-arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, npm: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp target/${{ matrix.target }}/release/kula$ext dist/
          tar -czf kula-${{ matrix.target }}.tar.gz -C dist kula$ext
          (sha256sum kula-${{ matrix.target }}.tar.gz 2>/dev/null || shasum -a 256 kula-${{ matrix.target }}.tar.gz) > kula-${{ matrix.target }}.tar.gz.sha256
          ./packaging/npm/make-platform-package.sh ${{ matrix.npm }} dist/kula$ext "${GITHUB_REF_NAME#v}" npm-out
      - if: contains(matrix.target, 'linux')
        run: cargo install cargo-deb --locked && cargo deb --no-build --no-strip --target ${{ matrix.target }} --deb-version "1:${GITHUB_REF_NAME#v}" -o . && for f in *.deb; do mv "$f" "${f/_1:/_}"; done  # epoch stays in the package, not the filename
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            kula-*.tar.gz*
            *.deb
            npm-out
      - uses: PyO3/maturin-action@v1
        with: { command: build, args: "--release --out wheels --target-dir target-wheels", target: "${{ matrix.target }}", manylinux: "2_28" }
      - uses: actions/upload-artifact@v4
        with: { name: "wheels-${{ matrix.target }}", path: wheels }

  # Language packs: every grammar in src/index/packs.toml compiled to a shared
  # library per target, with the sha256 manifest `kula lang add` verifies
  # against. Windows has no prebuilt packs yet (they need an MSVC build path).
  langpacks:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, cc: "cc", cxx: "c++" }
          - { target: x86_64-apple-darwin, os: macos-latest, cc: "cc -arch x86_64", cxx: "c++ -arch x86_64" }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, cc: "cc", cxx: "c++" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, cc: "cc", cxx: "c++" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: build packs
        env: { CC: "${{ matrix.cc }}", CXX: "${{ matrix.cxx }}", KULA_BIN: "target/${{ matrix.target }}/release/kula" }
        run: scripts/build-langpacks.sh dist/langpacks
      - uses: actions/upload-artifact@v4
        with:
          name: langpacks-${{ matrix.target }}
          path: |
            dist/langpacks/langpack-*
            dist/langpacks/langpacks-*.json

  release:
    needs: [build, langpacks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      # Source tarball with the built web UI inside, so distro builds need only Rust.
      - name: source tarball
        run: |
          v="${GITHUB_REF_NAME#v}"; n="kula-$v"
          git archive --format=tar --prefix="$n/" HEAD | tar -x -C .
          mkdir -p "$n/web/dist" && cp -r artifacts/web-dist/. "$n/web/dist/"
          tar -czf "$n-src.tar.gz" "$n" && sha256sum "$n-src.tar.gz" > "$n-src.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/bin-*/kula-*.tar.gz*
            artifacts/bin-*/*.deb
            kula-*-src.tar.gz*
            scripts/install.sh
      # ~700 pack files in one burst trip GitHub's secondary rate limit, so they
      # go up one at a time, skipping any a previous run already uploaded.
      - name: language packs
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          have=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for f in artifacts/langpacks-*/*; do
            grep -qxF "$(basename "$f")" <<<"$have" && continue
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber || { sleep 90; gh release upload "$GITHUB_REF_NAME" "$f" --clobber; }
            sleep 1
          done

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    continue-on-error: true  # until trusted publishing is configured on pypi.org
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "wheels-*", path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

  npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "bin-*", path: artifacts }
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - run: |
          v="${GITHUB_REF_NAME#v}"
          chmod +x artifacts/bin-*/npm-out/*/bin/kula 2>/dev/null || true  # artifacts drop the executable bit
          for d in artifacts/bin-*/npm-out/*/; do npm publish "$d" --access public || true; done
          cd packaging/npm/kula-cli && cp ../../../README.md . \
            && sed -i -E "s/\"[0-9]+\.[0-9]+\.[0-9]+\"/\"$v\"/g" package.json && npm publish --access public

  npm-launcher:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env: { V: "${{ inputs.version }}", P: "${{ inputs.platforms || inputs.version }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - run: |
          for p in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do npm view "@kula-cli/$p@$P" version; done
          cd packaging/npm/kula-cli && cp ../../../README.md . \
            && node -e 'const f="package.json",j=require("./"+f);j.version=process.env.V;for(const k in j.optionalDependencies)j.optionalDependencies[k]=process.env.P;require("fs").writeFileSync(f,JSON.stringify(j,null,2)+"\n")' \
            && npm publish --access public

  crates:
    needs: build
    runs-on: ubuntu-latest
    env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - uses: dtolnay/rust-toolchain@stable
      - if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --allow-dirty

  # This repo is the tap (brew tap a12n4v/kula https://github.com/A12N4V/kula),
  # so the bumped formula is committed straight to main.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with: { pattern: "bin-*", path: artifacts }
      - run: |
          v="${GITHUB_REF_NAME#v}"; f=Formula/kula.rb
          sed -i "s/^  version \".*\"/  version \"$v\"/" $f
          for t in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            sha=$(cut -d' ' -f1 artifacts/bin-$t/kula-$t.tar.gz.sha256)
            sed -i "/kula-$t.tar.gz\"/{n;s/sha256 \"[0-9a-f]*\"/sha256 \"$sha\"/}" $f
          done
          git diff --quiet && exit 0
          git -c user.name=kula-bot -c user.email=bot@kula.dev commit -qam "Formula: kula $v" && git push origin HEAD:main

  # Signed apt repository on GitHub Pages:  https://a12n4v.github.io/kula/apt
  apt:
    needs: release
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    env: { APT_GPG_KEY: "${{ secrets.APT_GPG_KEY }}" }
    steps:
      - uses: actions/checkout@v4
        if: env.APT_GPG_KEY != ''
      - uses: actions/download-artifact@v4
        if: env.APT_GPG_KEY != ''
        with: { pattern: "bin-*linux*", path: artifacts, merge-multiple: true }
      - if: env.APT_GPG_KEY != ''
        run: ./packaging/apt/build-repo.sh artifacts site
      - uses: actions/upload-pages-artifact@v3
        if: env.APT_GPG_KEY != ''
        with: { path: site }
      - id: deploy
        if: env.APT_GPG_KEY != ''
        uses: actions/deploy-pages@v4
