[package]
name = "kula"
version = "1.0.2"
edition = "2021"
rust-version = "1.80"
description = "Git, with a map. A local-first git client that turns your repository into a living knowledge graph."
license = "GPL-3.0-only"
repository = "https://github.com/A12N4V/kula"
homepage = "https://github.com/A12N4V/kula"
readme = "README.md"
keywords = ["git", "knowledge-graph", "code-intelligence", "mcp", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]
# web/dist is git-ignored but must ship so `cargo install kula` gets the UI.
include = ["src/**", "tests/**", "build.rs", "web/dist/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "rustfmt.toml"]

[[bin]]
name = "kula"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
ignore = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
axum = "0.8"
rust-embed = "8"
mime_guess = "2"
open = "5"
streaming-iterator = "0.1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "display"] }
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-php = "0.24"
oxigraph = { version = "0.5", default-features = false }
globset = "0.4"
toml_edit = { version = "0.23", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Arnav Sharma <arnavs15@uci.edu>"
copyright = "2026, Arnav Sharma"
license-file = ["LICENSE", "0"]
extended-description = "Kula is a local-first git client that turns a repository into a knowledge graph: graph-aware review, local issues, proposals and notes, and an MCP server that gives AI agents context, fences, workflows and memory anchored to the code."
depends = "git"
section = "vcs"
priority = "optional"
assets = [["target/release/kula", "usr/bin/", "755"], ["README.md", "usr/share/doc/kula/README", "644"]]
