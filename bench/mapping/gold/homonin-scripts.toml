# Gold set – homonin-scripts. Hand-written from the README's outcomes (the
# six operations decode → resolve → normalise → bind → compute → express,
# the reviewed Binding record and the travelling VersionState) and the source
# files that implement them. Not copied from engine output; producibility is
# checked afterwards with KULA_BENCH_DEBUG=1.
# Source: KULA_BENCH_HOMONIN, default ~/Desktop/projects/homonin/homonin-scripts.
repo = "homonin-scripts"
description = "homonin-scripts – genomics, signal and clinical analysis scripts"

[[flow]]
name = "Decode a POD5 long-read signal file"
outcome = "Read raw signal records out of a POD5 container."
keywords = ["decode", "signal", "pod5"]
members = [
  "src/homonin/genomic/raw_long_read_signal/pod5.py::decode",
  "src/homonin/genomic/raw_long_read_signal/pod5.py::decode_official",
