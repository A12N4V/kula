# kula.toml – shared settings for this repository's graph. Commit it.
# Docs: https://github.com/A12N4V/kula#configuration

[project]
name = "c1"
default_branch = "main"   # what proposals and `kula check` compare against

[index]
exclude = []   # gitignore-style globs, on top of .gitignore
max_file_kb = 1024

[hooks]
reindex = true   # keep the graph current after commit / checkout / merge

[check]
max_risk = "medium"   # CI gate: none | low | medium | high

[agents]
hide_secrets = false
memory = false
allow_solo = false

[[team]]
name = "ship"
about = "demo team"
members = [{ agent = "claude", workflow = "polish", role = "lead" }, { agent = "cursor", workflow = "tests", role = "" }]

[[research]]
name = "autoresearch"
metric = "wc -l src/app.rs"
goal = "min"
scope = ["src/**"]
budget = 5

[embed]
decided = true
enabled = false

[[workflow]]
name = "polish"
about = "Small cleanups"
scope = ["src/**"]
steps = ["Tidy", "verify"]

[[workflow]]
name = "u19-loop"
about = "Seconds the test suite takes; agents may not touch the tests themselves."
scope = ["src/**"]
memory = "write"
steps = ["research: the metric, the baseline, the best so far and every experiment tried", "Form one hypothesis; change only the files in scope", "experiment: kula runs the metric, keeps the change as a commit if it is better, reverts it if not", "remember what worked and what didn't, on the code it was about", "Repeat until the budget is spent; never edit the metric or its inputs"]
prompt = "Make the test suite faster without changing what it checks. Profile first; one change per experiment."

[workflow.research]
metric = "echo 41"
goal = "min"
budget = 20
icon = "faster-tests"

[[workflow]]
name = "u19-open"
about = "Seconds the test suite takes; agents may not touch the tests themselves."
scope = ["src/**"]
memory = "write"
steps = ["research: the metric, the baseline, the best so far and every experiment tried", "Form one hypothesis; change only the files in scope", "experiment: kula runs the metric, keeps the change as a commit if it is better, reverts it if not", "remember what worked and what didn't, on the code it was about", "Repeat until the budget is spent; never edit the metric or its inputs"]
prompt = "Make the test suite faster without changing what it checks. Profile first; one change per experiment."

[workflow.research]
metric = "echo 7"
goal = "min"
budget = 20
icon = "faster-tests"

[[workflow]]
name = "u19-lint"
about = "Warnings from the linter; a safe first loop for a new team."
scope = ["src/**"]
memory = "write"
steps = ["research: the metric, the baseline, the best so far and every experiment tried", "Form one hypothesis; change only the files in scope", "experiment: kula runs the metric, keeps the change as a commit if it is better, reverts it if not", "remember what worked and what didn't, on the code it was about", "Repeat until the budget is spent; never edit the metric or its inputs"]
prompt = "Fix lint warnings without changing behaviour. Group warnings of one kind into one experiment."

[workflow.research]
metric = "cargo clippy --quiet 2>&1 | grep -c '^warning'"
goal = "min"
budget = 40
icon = "lint"

[[workflow]]
