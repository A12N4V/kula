# kula.toml – shared settings for this repository's graph. Commit it.
# Docs: https://github.com/A12N4V/kula#configuration

[project]
name = "c1"
default_branch = "main"   # what proposals and `kula check` compare against

[index]
exclude = []   # gitignore-style globs, on top of .gitignore
max_file_kb = 1024

[hooks]
reindex = true   # keep the graph current after commit / checkout / merge

[check]
max_risk = "medium"   # CI gate: none | low | medium | high

[agents]
hide_secrets = true   # keep .env, keys and certificates out of every agent answer
memory = true         # let agents remember facts about the code (`kula memory`)

# Fence code off from AI agents. locked: read, never edit · hidden: never shown ·
# review: editable, flagged in `kula check`. Paths are globs; symbols are names.
# [[guard]]
# paths = ["migrations/**"]
# level = "locked"
# reason = "schema changes go through the DBA"

[[workflow]]
name = "polish"
about = "Small cleanups"
scope = ["src/**"]
steps = ["Tidy", "verify"]

[[team]]
name = "ship"
about = "demo team"
members = [{ agent = "claude", workflow = "polish", role = "lead" }, { agent = "cursor", workflow = "tests", role = "" }]

[[research]]
name = "autoresearch"
metric = "wc -l src/app.rs"
goal = "min"
scope = ["src/**"]
budget = 5
